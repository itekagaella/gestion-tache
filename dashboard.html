<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - myTask</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-page">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div id="toast-container" class="toast-container"></div>

  <div class="page-wrapper">
    <nav class="navbar">
      <div class="container">
        <a href="dashboard.html" class="logo">
          <svg class="logo-icon" width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="34" y2="34">
                <stop offset="0%" stop-color="#7e9fb0"/>
                <stop offset="100%" stop-color="#a3c0cf"/>
              </linearGradient>
            </defs>
            <rect width="34" height="34" rx="9" fill="url(#logo-grad)"/>
            <path d="M10 17.5L14.5 22L24 12" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="logo-text">myTask</span>
        </a>
        <div class="nav-links">
          <div class="live-clock" id="live-clock">
            <span class="clock-dot"></span>
            <span id="clock-time">--:--</span>
          </div>
          <button class="btn btn-danger btn-sm" onclick="handleLogout()">
            Deconnexion
          </button>
        </div>
      </div>
    </nav>

    <div class="dashboard-header">
      <div class="container">
        <div class="dashboard-greeting">
          <h1 id="page-title">Bonjour</h1>
          <div class="dashboard-meta">
            <span class="dashboard-date" id="dashboard-date">--</span>
            <span class="dashboard-sep">|</span>
            <span class="dashboard-subtitle" id="dashboard-subtitle">Gerez vos taches efficacement</span>
          </div>
        </div>
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">?</div>
          <div>
            <div class="user-name" id="user-name">-</div>
            <div class="user-email" id="user-email">-</div>
          </div>
        </div>
      </div>
    </div>

    <main class="container fade-in">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-label">Total</div>
            <div class="stat-dot accent"></div>
          </div>
          <div class="stat-value accent" id="stat-total">0</div>
          <div class="stat-bar"><div class="stat-bar-fill accent" id="bar-total"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-label">En cours</div>
            <div class="stat-dot pink"></div>
          </div>
          <div class="stat-value pink" id="stat-active">0</div>
          <div class="stat-bar"><div class="stat-bar-fill pink" id="bar-active"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-label">Terminees</div>
            <div class="stat-dot success"></div>
          </div>
          <div class="stat-value success" id="stat-done">0</div>
          <div class="stat-bar"><div class="stat-bar-fill success" id="bar-done"></div></div>
        </div>
      </div>

      <section class="tasks-section">
        <div class="section-header">
          <h2>Mes taches</h2>
          <div class="filters">
            <button class="filter-btn active" id="filter-all">Toutes</button>
            <button class="filter-btn" id="filter-active">En cours</button>
            <button class="filter-btn" id="filter-done">Terminees</button>
          </div>
        </div>

        <form id="add-task-form" class="add-task-card">
          <div class="add-task-input-group">
            <input type="text" id="task-input" class="form-input" placeholder="Que voulez-vous accomplir ?" required>
            <select id="task-tag">
              <option value="personal">Personnel</option>
              <option value="work">Travail</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Ajouter</button>
        </form>

        <div class="task-list" id="task-list">
          <div class="empty-state">
            <h3>Chargement...</h3>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">myTask &copy; 2026</div>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>initDashboard();</script>

  <!-- WhatsApp Floating Button -->
  <a href="https://wa.me/NUMERO_WHATSAPP?text=Bonjour%2C%20j%27ai%20une%20question%20concernant%20myTask"
     target="_blank"
     rel="noopener noreferrer"
     class="whatsapp-float"
     aria-label="Contactez-nous sur WhatsApp">
    <span class="whatsapp-float-tooltip">Besoin d'aide ?</span>
    <span class="whatsapp-float-icon">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <path d="M16.004 0h-.008C7.174 0 0 7.176 0 16c0 3.5 1.132 6.744 3.058 9.374L1.054 30.69l5.532-1.742A15.9 15.9 0 0 0 16.004 32C24.826 32 32 24.822 32 16S24.826 0 16.004 0zm9.318 22.594c-.39 1.096-1.932 2.006-3.158 2.27-.838.18-1.934.322-5.61-1.206-4.706-1.952-7.732-6.73-7.964-7.044-.224-.314-1.876-2.498-1.876-4.764 0-2.266 1.19-3.378 1.612-3.84.39-.428.924-.558 1.23-.558.298 0 .584.002.84.016.27.012.63-.102.984.754.39.952 1.332 3.236 1.446 3.466.114.23.19.5.038.796-.152.308-.286.498-.528.768-.242.27-.468.478-.71.726-.22.224-.47.462-.198.866.266.396 1.184 1.952 2.54 3.162 1.744 1.558 3.168 2.042 3.676 2.27.396.178.822.1 1.078-.214.266-.324.59-.862.924-1.386.236-.372.534-.42.894-.284.364.13 2.306 1.084 2.7 1.28.396.196.66.294.756.458.096.164.096.95-.294 1.87z"/>
      </svg>
    </span>
  </a>
</body>
</html>
