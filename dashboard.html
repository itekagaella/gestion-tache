<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - myTask</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-page">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div id="toast-container" class="toast-container"></div>

  <div class="page-wrapper">
    <nav class="navbar">
      <div class="container">
        <a href="dashboard.html" class="logo">
          <svg class="logo-icon" width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="34" y2="34">
                <stop offset="0%" stop-color="#7e9fb0"/>
                <stop offset="100%" stop-color="#a3c0cf"/>
              </linearGradient>
            </defs>
            <rect width="34" height="34" rx="9" fill="url(#logo-grad)"/>
            <path d="M10 17.5L14.5 22L24 12" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="logo-text">myTask</span>
        </a>
        <div class="nav-links">
          <div class="live-clock" id="live-clock">
            <span class="clock-dot"></span>
            <span id="clock-time">--:--</span>
          </div>
          <button class="btn btn-danger btn-sm" onclick="handleLogout()">
            Deconnexion
          </button>
        </div>
      </div>
    </nav>

    <div class="dashboard-header">
      <div class="container">
        <div class="dashboard-greeting">
          <h1 id="page-title">Bonjour</h1>
          <div class="dashboard-meta">
            <span class="dashboard-date" id="dashboard-date">--</span>
            <span class="dashboard-sep">|</span>
            <span class="dashboard-subtitle" id="dashboard-subtitle">Gerez vos taches efficacement</span>
          </div>
        </div>
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">?</div>
          <div>
            <div class="user-name" id="user-name">-</div>
            <div class="user-email" id="user-email">-</div>
          </div>
        </div>
        <div class="weather-card" id="weather-card">
          <div class="weather-icon" id="weather-icon">--</div>
          <div class="weather-details">
            <div class="weather-temp" id="weather-temp">--°</div>
            <div class="weather-desc" id="weather-desc">Chargement...</div>
            <div class="weather-location" id="weather-location"></div>
          </div>
        </div>
      </div>
    </div>

    <main class="container fade-in">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-label">Total</div>
            <div class="stat-dot accent"></div>
          </div>
          <div class="stat-value accent" id="stat-total">0</div>
          <div class="stat-bar"><div class="stat-bar-fill accent" id="bar-total"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-label">En cours</div>
            <div class="stat-dot pink"></div>
          </div>
          <div class="stat-value pink" id="stat-active">0</div>
          <div class="stat-bar"><div class="stat-bar-fill pink" id="bar-active"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-label">Terminees</div>
            <div class="stat-dot success"></div>
          </div>
          <div class="stat-value success" id="stat-done">0</div>
          <div class="stat-bar"><div class="stat-bar-fill success" id="bar-done"></div></div>
        </div>
      </div>

      <section class="tasks-section">
        <div class="section-header">
          <h2>Mes taches</h2>
          <div class="filters">
            <button class="filter-btn active" id="filter-all">Toutes</button>
            <button class="filter-btn" id="filter-active">En cours</button>
            <button class="filter-btn" id="filter-done">Terminees</button>
          </div>
        </div>

        <form id="add-task-form" class="add-task-card">
          <div class="add-task-input-group">
            <input type="text" id="task-input" class="form-input" placeholder="Que voulez-vous accomplir ?" required>
            <select id="task-tag">
              <option value="personal">Personnel</option>
              <option value="work">Travail</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Ajouter</button>
        </form>

        <div class="task-list" id="task-list">
          <div class="empty-state">
            <h3>Chargement...</h3>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">myTask &copy; 2026</div>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>initDashboard();</script>

  <!-- Weather Widget -->
  <script>
    (function(){
      var WMO={0:{d:'Clear sky',e:'\u2600\ufe0f'},1:{d:'Mostly clear',e:'\ud83c\udf24\ufe0f'},2:{d:'Partly cloudy',e:'\u26c5'},3:{d:'Overcast',e:'\u2601\ufe0f'},45:{d:'Fog',e:'\ud83c\udf2b\ufe0f'},48:{d:'Rime fog',e:'\ud83c\udf2b\ufe0f'},51:{d:'Light drizzle',e:'\ud83c\udf26\ufe0f'},53:{d:'Drizzle',e:'\ud83c\udf26\ufe0f'},55:{d:'Heavy drizzle',e:'\ud83c\udf27\ufe0f'},61:{d:'Light rain',e:'\ud83c\udf27\ufe0f'},63:{d:'Rain',e:'\ud83c\udf27\ufe0f'},65:{d:'Heavy rain',e:'\ud83c\udf27\ufe0f'},71:{d:'Light snow',e:'\ud83c\udf28\ufe0f'},73:{d:'Snow',e:'\ud83c\udf28\ufe0f'},75:{d:'Heavy snow',e:'\ud83c\udf28\ufe0f'},77:{d:'Snow grains',e:'\ud83c\udf28\ufe0f'},80:{d:'Light showers',e:'\ud83c\udf26\ufe0f'},81:{d:'Showers',e:'\ud83c\udf27\ufe0f'},82:{d:'Heavy showers',e:'\ud83c\udf27\ufe0f'},85:{d:'Light snow showers',e:'\ud83c\udf28\ufe0f'},86:{d:'Snow showers',e:'\ud83c\udf28\ufe0f'},95:{d:'Thunderstorm',e:'\u26c8\ufe0f'},96:{d:'Thunderstorm + hail',e:'\u26c8\ufe0f'},99:{d:'Thunderstorm + heavy hail',e:'\u26c8\ufe0f'}};
      var iconEl=document.getElementById('weather-icon'),tempEl=document.getElementById('weather-temp'),
          descEl=document.getElementById('weather-desc'),locEl=document.getElementById('weather-location');
      function render(lat,lon,data){
        var c=data.current_weather||data.current||{};
        var code=c.weathercode!=null?c.weathercode:(c.condition!=null?c.condition.code:0);
        var t=c.temperature!=null?c.temperature:(c.temperature_2m!=null?c.temperature_2m:null);
        var w=WMO[code]||{d:'Unknown',e:'\ud83c\udf24\ufe0f'};
        iconEl.textContent=w.e;
        tempEl.textContent=t!=null?Math.round(t)+'\u00b0':'--\u00b0';
        descEl.textContent=w.d;
        locEl.textContent=lat.toFixed(1)+'\u00b0, '+lon.toFixed(1)+'\u00b0';
      }
      function fetchWeather(lat,lon){
        var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto';
        fetch(url).then(function(r){return r.json()}).then(function(d){render(lat,lon,d)}).catch(function(){
          iconEl.textContent='\u2753';descEl.textContent='Impossible de charger';locEl.textContent='';
        });
      }
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(p){
          fetchWeather(p.coords.latitude,p.coords.longitude);
        },function(){
          fetchWeather(-4.32,15.31);
        });
      } else {
        fetchWeather(-4.32,15.31);
      }
    })();
  </script>

  <!-- WhatsApp Chat Widget -->
  <div class="wa-widget" id="waWidget">
    <div class="wa-chatbox" id="waChatbox">
      <div class="wa-chatbox-header">
        <div class="wa-chatbox-avatar">
          <svg viewBox="0 0 32 32"><path d="M16.004 0h-.008C7.174 0 0 7.176 0 16c0 3.5 1.132 6.744 3.058 9.374L1.054 30.69l5.532-1.742A15.9 15.9 0 0 0 16.004 32C24.826 32 32 24.822 32 16S24.826 0 16.004 0zm9.318 22.594c-.39 1.096-1.932 2.006-3.158 2.27-.838.18-1.934.322-5.61-1.206-4.706-1.952-7.732-6.73-7.964-7.044-.224-.314-1.876-2.498-1.876-4.764 0-2.266 1.19-3.378 1.612-3.84.39-.428.924-.558 1.23-.558.298 0 .584.002.84.016.27.012.63-.102.984.754.39.952 1.332 3.236 1.446 3.466.114.23.19.5.038.796-.152.308-.286.498-.528.768-.242.27-.468.478-.71.726-.22.224-.47.462-.198.866.266.396 1.184 1.952 2.54 3.162 1.744 1.558 3.168 2.042 3.676 2.27.396.178.822.1 1.078-.214.266-.324.59-.862.924-1.386.236-.372.534-.42.894-.284.364.13 2.306 1.084 2.7 1.28.396.196.66.294.756.458.096.164.096.95-.294 1.87z"/></svg>
        </div>
        <div class="wa-chatbox-info">
          <h4>myTask Support</h4>
          <span>En ligne</span>
        </div>
      </div>
      <div class="wa-chatbox-body">
        <div class="wa-chatbox-bubble">Bonjour ! Comment puis-je vous aider ?</div>
      </div>
      <div class="wa-chatbox-footer">
        <input type="text" class="wa-chatbox-input" id="waInput" placeholder="Tapez votre message..." maxlength="500">
        <button class="wa-chatbox-send" id="waSend" aria-label="Envoyer">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
    <button class="wa-widget-btn" id="waBtn" aria-label="Ouvrir le chat WhatsApp">
      <svg viewBox="0 0 32 32"><path d="M16.004 0h-.008C7.174 0 0 7.176 0 16c0 3.5 1.132 6.744 3.058 9.374L1.054 30.69l5.532-1.742A15.9 15.9 0 0 0 16.004 32C24.826 32 32 24.822 32 16S24.826 0 16.004 0zm9.318 22.594c-.39 1.096-1.932 2.006-3.158 2.27-.838.18-1.934.322-5.61-1.206-4.706-1.952-7.732-6.73-7.964-7.044-.224-.314-1.876-2.498-1.876-4.764 0-2.266 1.19-3.378 1.612-3.84.39-.428.924-.558 1.23-.558.298 0 .584.002.84.016.27.012.63-.102.984.754.39.952 1.332 3.236 1.446 3.466.114.23.19.5.038.796-.152.308-.286.498-.528.768-.242.27-.468.478-.71.726-.22.224-.47.462-.198.866.266.396 1.184 1.952 2.54 3.162 1.744 1.558 3.168 2.042 3.676 2.27.396.178.822.1 1.078-.214.266-.324.59-.862.924-1.386.236-.372.534-.42.894-.284.364.13 2.306 1.084 2.7 1.28.396.196.66.294.756.458.096.164.096.95-.294 1.87z"/></svg>
    </button>
  </div>
  <script>
    (function(){
      var btn=document.getElementById('waBtn'),box=document.getElementById('waChatbox'),
          input=document.getElementById('waInput'),send=document.getElementById('waSend');
      btn.addEventListener('click',function(){box.classList.toggle('open');btn.classList.toggle('active');});
      function openWa(){var m=input.value.trim();if(!m)return;window.open('https://wa.me/25776871111?text='+encodeURIComponent(m),'_blank');}
      send.addEventListener('click',openWa);
      input.addEventListener('keydown',function(e){if(e.key==='Enter')openWa();});
    })();
  </script>
</body>
</html>
