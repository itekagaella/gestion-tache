<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - myTask</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-page">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div id="toast-container" class="toast-container"></div>

  <div class="page-wrapper">
    <nav class="navbar">
      <div class="container">
        <a href="dashboard.html" class="logo">
          <svg class="logo-icon" width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="34" y2="34">
                <stop offset="0%" stop-color="#7e9fb0"/>
                <stop offset="100%" stop-color="#a3c0cf"/>
              </linearGradient>
            </defs>
            <rect width="34" height="34" rx="9" fill="url(#logo-grad)"/>
            <path d="M10 17.5L14.5 22L24 12" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="logo-text">myTask</span>
        </a>
        <div class="nav-links">
          <div class="live-clock" id="live-clock">
            <span class="clock-dot"></span>
            <span id="clock-time">--:--</span>
          </div>
          <button class="btn btn-danger btn-sm" onclick="handleLogout()">
            Deconnexion
          </button>
        </div>
      </div>
    </nav>

    <div class="dashboard-header">
      <div class="container">
        <div class="dashboard-greeting">
          <h1 id="page-title">Bonjour</h1>
          <div class="dashboard-meta">
            <span class="dashboard-date" id="dashboard-date">--</span>
            <span class="dashboard-sep">|</span>
            <span class="dashboard-subtitle" id="dashboard-subtitle">Gerez vos taches efficacement</span>
          </div>
        </div>
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">?</div>
          <div>
            <div class="user-name" id="user-name">-</div>
            <div class="user-email" id="user-email">-</div>
          </div>
        </div>
        <div class="weather-card" id="weather-card">
          <div class="weather-icon" id="weather-icon">--</div>
          <div class="weather-details">
            <div class="weather-temp" id="weather-temp">--°</div>
            <div class="weather-desc" id="weather-desc">Chargement...</div>
            <div class="weather-location" id="weather-location"></div>
          </div>
        </div>
      </div>
    </div>

    <main class="container fade-in">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-label">Total</div>
            <div class="stat-dot accent"></div>
          </div>
          <div class="stat-value accent" id="stat-total">0</div>
          <div class="stat-bar"><div class="stat-bar-fill accent" id="bar-total"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-label">En cours</div>
            <div class="stat-dot pink"></div>
          </div>
          <div class="stat-value pink" id="stat-active">0</div>
          <div class="stat-bar"><div class="stat-bar-fill pink" id="bar-active"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-label">Terminees</div>
            <div class="stat-dot success"></div>
          </div>
          <div class="stat-value success" id="stat-done">0</div>
          <div class="stat-bar"><div class="stat-bar-fill success" id="bar-done"></div></div>
        </div>
      </div>

      <section class="tasks-section">
        <div class="section-header">
          <h2>Mes taches</h2>
          <div class="filters">
            <button class="filter-btn active" id="filter-all">Toutes</button>
            <button class="filter-btn" id="filter-active">En cours</button>
            <button class="filter-btn" id="filter-done">Terminees</button>
          </div>
        </div>

        <form id="add-task-form" class="add-task-card">
          <div class="add-task-input-group">
            <input type="text" id="task-input" class="form-input" placeholder="Que voulez-vous accomplir ?" required>
            <select id="task-tag">
              <option value="personal">Personnel</option>
              <option value="work">Travail</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Ajouter</button>
        </form>

        <div class="task-list" id="task-list">
          <div class="empty-state">
            <h3>Chargement...</h3>
          </div>
        </div>
      </section>

      <section class="chat-inbox-section">
        <div class="chat-layout">
          <div class="chat-inbox" id="chatInbox">
            <div class="chat-inbox-header">
              <h3>Messages</h3>
              <span class="chat-inbox-badge" id="chatBadge">0</span>
            </div>
            <div class="chat-sessions" id="chatSessions">
              <div class="chat-empty">
                <div class="chat-empty-icon">💬</div>
                Aucun message pour le moment
              </div>
            </div>
          </div>
          <div class="chat-view" id="chatView" style="display:none">
            <div class="chat-view-header">
              <button class="chat-view-back" id="chatBack">&#8592;</button>
              <div>
                <div class="chat-view-name" id="chatViewName">-</div>
                <div class="chat-view-status">En ligne</div>
              </div>
            </div>
            <div class="chat-view-messages" id="chatViewMessages"></div>
            <div class="chat-view-footer">
              <input type="text" class="chat-view-input" id="chatViewInput" placeholder="Repondre..." maxlength="500">
              <button class="chat-view-send" id="chatViewSend" aria-label="Envoyer">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">myTask &copy; 2026</div>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>initDashboard();</script>

  <!-- Owner Chat Inbox -->
  <script src="js/chat.js"></script>
  <script>
    (function(){
      var sessions=document.getElementById('chatSessions'),
          view=document.getElementById('chatView'),
          inbox=document.getElementById('chatInbox'),
          viewMsgs=document.getElementById('chatViewMessages'),
          viewInput=document.getElementById('chatViewInput'),
          viewSend=document.getElementById('chatViewSend'),
          viewName=document.getElementById('chatViewName'),
          backBtn=document.getElementById('chatBack'),
          badge=document.getElementById('chatBadge');
      var currentSession=null;

      function timeAgo(d){
        var now=new Date(),diff=Math.floor((now-d)/1000);
        if(diff<60)return "a l'instant";
        if(diff<3600)return Math.floor(diff/60)+'min';
        if(diff<86400)return Math.floor(diff/3600)+'h';
        return Math.floor(diff/86400)+'j';
      }

      async function loadSessions(){
        var list=await ChatModule.getAllSessions();
        if(!list.length){
          sessions.innerHTML='<div class="chat-empty"><div class="chat-empty-icon">💬</div>Aucun message pour le moment</div>';
          return;
        }
        sessions.innerHTML='';
        var unread=0;
        for(var i=0;i<list.length;i++){
          var s=list[i];
          var msgs=await ChatModule.getSessionMessages(s.session_id);
          var last=msgs[msgs.length-1];
          var count=0;
          for(var j=0;j<msgs.length;j++){
            if(msgs[j].sender_type==='visitor'&&!msgs[j].read) count++;
          }
          unread+=count;
          var initials=s.sender_name.charAt(0).toUpperCase();
          var item=document.createElement('div');
          item.className='chat-session-item';
          item.innerHTML='<div class="chat-session-avatar">'+initials+'</div>'
            +'<div class="chat-session-info">'
            +'<div class="chat-session-name">'+s.sender_name+(count?' <span style="color:var(--danger);font-size:11px">('+count+')</span>':'')+'</div>'
            +'<div class="chat-session-preview">'+(last?last.content:'')+'</div>'
            +'</div>'
            +'<div class="chat-session-time">'+(last?timeAgo(new Date(last.created_at)):'')+'</div>';
          (function(sid,name){
            item.addEventListener('click',function(){openChat(sid,name);});
          })(s.session_id,s.sender_name);
          sessions.appendChild(item);
        }
        if(unread>0){badge.textContent=unread;badge.classList.add('show');}
        else badge.classList.remove('show');
      }

      async function openChat(sid,name){
        currentSession=sid;
        viewName.textContent=name;
        view.style.display='flex';
        inbox.style.display='none';
        await ChatModule.markRead(sid);
        var msgs=await ChatModule.getSessionMessages(sid);
        viewMsgs.innerHTML='';
        msgs.forEach(function(m){addViewMsg(m);});
        loadSessions();
      }

      function addViewMsg(m){
        var div=document.createElement('div');
        div.className='wa-msg wa-msg-'+m.sender_type;
        var t=new Date(m.created_at);
        var time=t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
        div.innerHTML='<span class="wa-msg-name">'+m.sender_name+'</span>'+m.content+'<span class="wa-msg-time">'+time+'</span>';
        viewMsgs.appendChild(div);
        viewMsgs.scrollTop=viewMsgs.scrollHeight;
      }

      async function sendReply(){
        var text=viewInput.value.trim();
        if(!text||!currentSession)return;
        viewInput.value='';
        var m=await ChatModule.sendMessage(text,'Support','owner');
        if(m) addViewMsg(m);
        loadSessions();
      }

      viewSend.addEventListener('click',sendReply);
      viewInput.addEventListener('keydown',function(e){if(e.key==='Enter')sendReply();});

      backBtn.addEventListener('click',function(){
        view.style.display='none';
        inbox.style.display='block';
        currentSession=null;
        loadSessions();
      });

      ChatModule.subscribeAll(function(m){
        if(m.sender_type==='visitor'){
          if(currentSession===m.session_id) addViewMsg(m);
          loadSessions();
        }
      });

      loadSessions();
    })();
  </script>

  <!-- Weather Widget -->
  <script>
    (function(){
      var WMO={0:{d:'Clear sky',e:'\u2600\ufe0f'},1:{d:'Mostly clear',e:'\ud83c\udf24\ufe0f'},2:{d:'Partly cloudy',e:'\u26c5'},3:{d:'Overcast',e:'\u2601\ufe0f'},45:{d:'Fog',e:'\ud83c\udf2b\ufe0f'},48:{d:'Rime fog',e:'\ud83c\udf2b\ufe0f'},51:{d:'Light drizzle',e:'\ud83c\udf26\ufe0f'},53:{d:'Drizzle',e:'\ud83c\udf26\ufe0f'},55:{d:'Heavy drizzle',e:'\ud83c\udf27\ufe0f'},61:{d:'Light rain',e:'\ud83c\udf27\ufe0f'},63:{d:'Rain',e:'\ud83c\udf27\ufe0f'},65:{d:'Heavy rain',e:'\ud83c\udf27\ufe0f'},71:{d:'Light snow',e:'\ud83c\udf28\ufe0f'},73:{d:'Snow',e:'\ud83c\udf28\ufe0f'},75:{d:'Heavy snow',e:'\ud83c\udf28\ufe0f'},77:{d:'Snow grains',e:'\ud83c\udf28\ufe0f'},80:{d:'Light showers',e:'\ud83c\udf26\ufe0f'},81:{d:'Showers',e:'\ud83c\udf27\ufe0f'},82:{d:'Heavy showers',e:'\ud83c\udf27\ufe0f'},85:{d:'Light snow showers',e:'\ud83c\udf28\ufe0f'},86:{d:'Snow showers',e:'\ud83c\udf28\ufe0f'},95:{d:'Thunderstorm',e:'\u26c8\ufe0f'},96:{d:'Thunderstorm + hail',e:'\u26c8\ufe0f'},99:{d:'Thunderstorm + heavy hail',e:'\u26c8\ufe0f'}};
      var iconEl=document.getElementById('weather-icon'),tempEl=document.getElementById('weather-temp'),
          descEl=document.getElementById('weather-desc'),locEl=document.getElementById('weather-location');
      function render(lat,lon,data){
        var c=data.current_weather||data.current||{};
        var code=c.weathercode!=null?c.weathercode:(c.condition!=null?c.condition.code:0);
        var t=c.temperature!=null?c.temperature:(c.temperature_2m!=null?c.temperature_2m:null);
        var w=WMO[code]||{d:'Unknown',e:'\ud83c\udf24\ufe0f'};
        iconEl.textContent=w.e;
        tempEl.textContent=t!=null?Math.round(t)+'\u00b0':'--\u00b0';
        descEl.textContent=w.d;
        locEl.textContent=lat.toFixed(1)+'\u00b0, '+lon.toFixed(1)+'\u00b0';
      }
      function fetchWeather(lat,lon){
        var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto';
        fetch(url).then(function(r){return r.json()}).then(function(d){render(lat,lon,d)}).catch(function(){
          iconEl.textContent='\u2753';descEl.textContent='Impossible de charger';locEl.textContent='';
        });
      }
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(p){
          fetchWeather(p.coords.latitude,p.coords.longitude);
        },function(){
          fetchWeather(-4.32,15.31);
        });
      } else {
        fetchWeather(-4.32,15.31);
      }
    })();
  </script>
</body>
</html>
