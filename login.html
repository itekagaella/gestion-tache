<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - myTask</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="page-wrapper">
    <nav class="navbar">
      <div class="container">
        <a href="index.html" class="logo">
          <svg class="logo-icon" width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="34" y2="34">
                <stop offset="0%" stop-color="#7e9fb0"/>
                <stop offset="100%" stop-color="#a3c0cf"/>
              </linearGradient>
            </defs>
            <rect width="34" height="34" rx="9" fill="url(#logo-grad)"/>
            <path d="M10 17.5L14.5 22L24 12" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="logo-text">myTask</span>
        </a>
        <div class="nav-links">
          <a href="register.html" class="btn btn-primary">Commencer</a>
        </div>
      </div>
    </nav>

    <div class="auth-wrapper">
      <div class="auth-card fade-in">
        <h1>Bon retour</h1>
        <p class="subtitle">Connectez-vous a votre compte</p>

        <div id="error-msg" class="auth-error"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-input" placeholder="vous@email.com" required>
          </div>
          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" class="form-input" placeholder="Votre mot de passe" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;" id="login-btn">
            Se connecter
          </button>
        </form>

        <div class="auth-footer">
          Pas encore de compte ? <a href="register.html">Creer un compte</a>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="container">myTask &copy; 2026</div>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      const session = await getSession();
      if (session) { window.location.href = 'dashboard.html'; return; }

      const form = document.getElementById('login-form');
      const errorEl = document.getElementById('error-msg');
      const btn = document.getElementById('login-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.classList.remove('show');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>';

        try {
          await signIn(
            document.getElementById('email').value,
            document.getElementById('password').value
          );
          window.location.href = 'dashboard.html';
        } catch (err) {
          errorEl.textContent = err.message === 'Invalid login credentials'
            ? 'Email ou mot de passe incorrect'
            : err.message;
          errorEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Se connecter';
        }
      });
    })();
  </script>
</body>
</html>
