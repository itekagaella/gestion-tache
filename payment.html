<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de paiement</title>

    <style>
        
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }


        #paymentForm {
            width: 400px;
            max-width: 90%;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        
        #paymentForm h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        
        #paymentForm label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        
        #paymentForm input,
        #paymentForm select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
        }

    
        #paymentForm input:focus,
        #paymentForm select:focus {
            border-color: #6f4e37;
            box-shadow: 0 0 5px rgba(111, 78, 55, 0.3);
        }

        /* Bouton Payer */
        #paymentForm button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background-color: #6f4e37;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

    
        #paymentForm button:hover {
            background-color: #4b2e1f;
            transform: translateY(-2px);
        }

    
        @media (max-width: 500px) {
            #paymentForm {
                margin: 30px auto;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <form id="paymentForm">

        <h2>Formulaire de paiement</h2>

        <label for="nom">Nom</label>
        <input type="text" id="nom"  required>

        <label for="montant">Montant</label>
        <input type="number" id="montant"  required>

        <label for="methode">Méthode de paiement</label>
        <select id="methode" required>
            <option value="">Choisir une méthode </option>
            <option value="lumicash">Lumicash</option>
            <option value="ecocash">EcoCash</option>
            <option value="carte">Carte bancaire</option>
        </select>

        <label for="telephone">Numéro de téléphone</label>
        <input type="tel" id="telephone" required>

        <button type="submit">Payer</button>

    </form>

  <!-- WhatsApp Button -->

     target="_blank"
     rel="noopener noreferrer"

      </svg>
    </span>
  </a>

  <style>
    .whatsapp-float{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;align-items:center;gap:10px;text-decoration:none;animation:whatsappPulse 2s ease-in-out infinite}
    .whatsapp-float:hover{transform:scale(1.05);animation:none}
    .whatsapp-float-icon{width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,.4),0 2px 8px rgba(0,0,0,.3);transition:box-shadow .3s}
    .whatsapp-float:hover .whatsapp-float-icon{box-shadow:0 6px 28px rgba(37,211,102,.55),0 3px 12px rgba(0,0,0,.35)}
    .whatsapp-float-icon svg{width:28px;height:28px;fill:#fff}
    .whatsapp-float-tooltip{position:absolute;right:68px;background:rgba(26,26,46,.9);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;white-space:nowrap;font-size:13px;font-weight:500;color:#fff;opacity:0;transform:translateX(8px);transition:opacity .3s,transform .3s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.3)}
    .whatsapp-float:hover .whatsapp-float-tooltip{opacity:1;transform:translateX(0)}
    .whatsapp-float-tooltip::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%) rotate(45deg);width:12px;height:12px;background:rgba(26,26,46,.9);border-right:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1)}
    @keyframes whatsappPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,.3)}50%{box-shadow:0 0 0 12px rgba(37,211,102,0)}}
    @media(max-width:640px){.whatsapp-float{bottom:16px;right:16px}.whatsapp-float-icon{width:50px;height:50px}.whatsapp-float-icon svg{width:24px;height:24px}.whatsapp-float-tooltip{display:none}}
  </style>
</body>
</html>
