<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de paiement</title>

    <style>
        
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }


        #paymentForm {
            width: 400px;
            max-width: 90%;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        
        #paymentForm h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        
        #paymentForm label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        
        #paymentForm input,
        #paymentForm select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
        }

    
        #paymentForm input:focus,
        #paymentForm select:focus {
            border-color: #6f4e37;
            box-shadow: 0 0 5px rgba(111, 78, 55, 0.3);
        }

        /* Bouton Payer */
        #paymentForm button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background-color: #6f4e37;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

    
        #paymentForm button:hover {
            background-color: #4b2e1f;
            transform: translateY(-2px);
        }

    
        @media (max-width: 500px) {
            #paymentForm {
                margin: 30px auto;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <form id="paymentForm">

        <h2>Formulaire de paiement</h2>

        <label for="nom">Nom</label>
        <input type="text" id="nom"  required>

        <label for="montant">Montant</label>
        <input type="number" id="montant"  required>

        <label for="methode">Méthode de paiement</label>
        <select id="methode" required>
            <option value="">Choisir une méthode </option>
            <option value="lumicash">Lumicash</option>
            <option value="ecocash">EcoCash</option>
            <option value="carte">Carte bancaire</option>
        </select>

        <label for="telephone">Numéro de téléphone</label>
        <input type="tel" id="telephone" required>

        <button type="submit">Payer</button>

    </form>

  <!-- WhatsApp Widget -->
  <div class="wa-widget" id="waWidget">
    <div class="wa-chatbox" id="waChatbox">
      <div class="wa-chatbox-header">
        <div class="wa-chatbox-avatar"><svg viewBox="0 0 32 32"><path d="M16.004 0h-.008C7.174 0 0 7.176 0 16c0 3.5 1.132 6.744 3.058 9.374L1.054 30.69l5.532-1.742A15.9 15.9 0 0 0 16.004 32C24.826 32 32 24.822 32 16S24.826 0 16.004 0zm9.318 22.594c-.39 1.096-1.932 2.006-3.158 2.27-.838.18-1.934.322-5.61-1.206-4.706-1.952-7.732-6.73-7.964-7.044-.224-.314-1.876-2.498-1.876-4.764 0-2.266 1.19-3.378 1.612-3.84.39-.428.924-.558 1.23-.558.298 0 .584.002.84.016.27.012.63-.102.984.754.39.952 1.332 3.236 1.446 3.466.114.23.19.5.038.796-.152.308-.286.498-.528.768-.242.27-.468.478-.71.726-.22.224-.47.462-.198.866.266.396 1.184 1.952 2.54 3.162 1.744 1.558 3.168 2.042 3.676 2.27.396.178.822.1 1.078-.214.266-.324.59-.862.924-1.386.236-.372.534-.42.894-.284.364.13 2.306 1.084 2.7 1.28.396.196.66.294.756.458.096.164.096.95-.294 1.87z"/></svg></div>
        <div class="wa-chatbox-info"><h4>myTask Support</h4><span>En ligne</span></div>
      </div>
      <div class="wa-chatbox-body"><div class="wa-chatbox-bubble">Bonjour ! Comment puis-je vous aider ?</div></div>
      <div class="wa-chatbox-footer">
        <input type="text" class="wa-chatbox-input" id="waInput" placeholder="Tapez votre message..." maxlength="500">
        <button class="wa-chatbox-send" id="waSend" aria-label="Envoyer"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
      </div>
    </div>
    <button class="wa-widget-btn" id="waBtn" aria-label="Ouvrir le chat WhatsApp"><svg viewBox="0 0 32 32"><path d="M16.004 0h-.008C7.174 0 0 7.176 0 16c0 3.5 1.132 6.744 3.058 9.374L1.054 30.69l5.532-1.742A15.9 15.9 0 0 0 16.004 32C24.826 32 32 24.822 32 16S24.826 0 16.004 0zm9.318 22.594c-.39 1.096-1.932 2.006-3.158 2.27-.838.18-1.934.322-5.61-1.206-4.706-1.952-7.732-6.73-7.964-7.044-.224-.314-1.876-2.498-1.876-4.764 0-2.266 1.19-3.378 1.612-3.84.39-.428.924-.558 1.23-.558.298 0 .584.002.84.016.27.012.63-.102.984.754.39.952 1.332 3.236 1.446 3.466.114.23.19.5.038.796-.152.308-.286.498-.528.768-.242.27-.468.478-.71.726-.22.224-.47.462-.198.866.266.396 1.184 1.952 2.54 3.162 1.744 1.558 3.168 2.042 3.676 2.27.396.178.822.1 1.078-.214.266-.324.59-.862.924-1.386.236-.372.534-.42.894-.284.364.13 2.306 1.084 2.7 1.28.396.196.66.294.756.458.096.164.096.95-.294 1.87z"/></svg></button>
  </div>
  <script>
  (function(){
    var btn=document.getElementById('waBtn'),box=document.getElementById('waChatbox'),
        input=document.getElementById('waInput'),send=document.getElementById('waSend');
    var isOpen=false;
    btn.addEventListener('click',function(){
      isOpen=!isOpen;box.classList.toggle('open',isOpen);btn.classList.toggle('active',isOpen);
      if(isOpen) input.focus();
    });
    function sendMsg(){
      var text=input.value.trim();if(!text)return;input.value='';
      isOpen=false;box.classList.remove('open');btn.classList.remove('active');
      window.open('https://wa.me/25776871111?text='+encodeURIComponent(text),'_blank');
    }
    send.addEventListener('click',sendMsg);
    input.addEventListener('keydown',function(e){if(e.key==='Enter')sendMsg();});
  })();
  </script>

  <style>
    .wa-widget{position:fixed;bottom:24px;right:24px;z-index:9999;font-family:Arial,sans-serif}
    .wa-widget-btn{width:56px;height:56px;border-radius:50%;background:#25D366;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,.4),0 2px 8px rgba(0,0,0,.3);transition:transform .25s,box-shadow .25s;animation:waPulse 2s ease-in-out infinite}
    .wa-widget-btn:hover{transform:scale(1.08);animation:none;box-shadow:0 6px 28px rgba(37,211,102,.55)}
    .wa-widget-btn svg{width:28px;height:28px;fill:#fff;transition:transform .3s}
    .wa-widget-btn.active svg{transform:rotate(90deg)}
    @keyframes waPulse{0%,100%{box-shadow:0 4px 20px rgba(37,211,102,.4),0 0 0 0 rgba(37,211,102,.3)}50%{box-shadow:0 4px 20px rgba(37,211,102,.4),0 0 0 12px rgba(37,211,102,0)}}
    .wa-chatbox{position:absolute;bottom:70px;right:0;width:320px;border-radius:16px;overflow:hidden;background:#1a1a2e;border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 48px rgba(0,0,0,.45);opacity:0;transform:translateY(12px) scale(.95);pointer-events:none;transition:opacity .3s,transform .3s}
    .wa-chatbox.open{opacity:1;transform:translateY(0) scale(1);pointer-events:all}
    .wa-chatbox-header{background:#075E54;padding:14px 16px;display:flex;align-items:center;gap:10px}
    .wa-chatbox-avatar{width:36px;height:36px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .wa-chatbox-avatar svg{width:20px;height:20px;fill:#fff}
    .wa-chatbox-info h4{margin:0;font-size:14px;font-weight:600;color:#fff}
    .wa-chatbox-info span{font-size:11px;color:rgba(255,255,255,.7)}
    .wa-chatbox-body{padding:14px;min-height:80px;background:#0f0f23}
    .wa-chatbox-bubble{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:12px 12px 12px 4px;padding:10px 12px;font-size:13px;line-height:1.5;color:rgba(255,255,255,.7)}
    .wa-chatbox-footer{padding:10px 12px;background:#1a1a2e;border-top:1px solid rgba(255,255,255,.1);display:flex;gap:8px;align-items:center}
    .wa-chatbox-input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:9px 14px;font-size:13px;color:#fff;outline:none;font-family:inherit;height:38px;transition:border-color .2s}
    .wa-chatbox-input::placeholder{color:rgba(255,255,255,.35)}
    .wa-chatbox-input:focus{border-color:#25D366}
    .wa-chatbox-send{width:38px;height:38px;border-radius:50%;background:#25D366;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s;flex-shrink:0}
    .wa-chatbox-send:hover{background:#1ebe5d;transform:scale(1.08)}
    .wa-chatbox-send svg{width:18px;height:18px;fill:#fff}
    @media(max-width:420px){.wa-chatbox{width:calc(100vw - 32px);right:-8px}.wa-widget{bottom:16px;right:16px}.wa-widget-btn{width:50px;height:50px}.wa-widget-btn svg{width:24px;height:24px}}
  </style>
</body>
</html>
