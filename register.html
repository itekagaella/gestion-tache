<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - myTask</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="page-wrapper">
    <nav class="navbar">
      <div class="container">
        <a href="index.html" class="logo">
          <svg class="logo-icon" width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="34" y2="34">
                <stop offset="0%" stop-color="#7e9fb0"/>
                <stop offset="100%" stop-color="#a3c0cf"/>
              </linearGradient>
            </defs>
            <rect width="34" height="34" rx="9" fill="url(#logo-grad)"/>
            <path d="M10 17.5L14.5 22L24 12" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="logo-text">myTask</span>
        </a>
        <div class="nav-links">
          <a href="login.html" class="btn btn-ghost">Connexion</a>
        </div>
      </div>
    </nav>

    <div class="auth-wrapper">
      <div class="auth-card fade-in">
        <h1>Creer un compte</h1>
        <p class="subtitle">Rejoignez myTask et commencez des maintenant</p>

        <div id="error-msg" class="auth-error"></div>

        <form id="register-form">
          <div class="form-group">
            <label for="fullname">Nom complet</label>
            <input type="text" id="fullname" class="form-input" placeholder="Jean Dupont" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-input" placeholder="vous@email.com" required>
          </div>
          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" class="form-input" placeholder="6 caracteres minimum" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;" id="register-btn">
            Creer mon compte
          </button>
        </form>

        <div class="auth-footer">
          Deja un compte ? <a href="login.html">Se connecter</a>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="container">myTask &copy; 2026</div>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      const session = await getSession();
      if (session) { window.location.href = 'dashboard.html'; return; }

      const form = document.getElementById('register-form');
      const errorEl = document.getElementById('error-msg');
      const btn = document.getElementById('register-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.classList.remove('show');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>';

        try {
          await signUp(
            document.getElementById('email').value,
            document.getElementById('password').value,
            document.getElementById('fullname').value
          );
          errorEl.textContent = 'Compte cree ! Verifiez votre email pour confirmer, puis connectez-vous.';
          errorEl.style.background = 'rgba(34, 197, 94, 0.1)';
          errorEl.style.borderColor = 'rgba(34, 197, 94, 0.15)';
          errorEl.style.color = 'var(--success)';
          errorEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Creer mon compte';
          form.reset();
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Creer mon compte';
        }
      });
    })();
  </script>

  <!-- WhatsApp Widget -->
  <div class="wa-widget" id="waWidget">
    <div class="wa-chatbox" id="waChatbox">
      <div class="wa-chatbox-header">
        <div class="wa-chatbox-avatar"><svg viewBox="0 0 32 32"><path d="M16.004 0h-.008C7.174 0 0 7.176 0 16c0 3.5 1.132 6.744 3.058 9.374L1.054 30.69l5.532-1.742A15.9 15.9 0 0 0 16.004 32C24.826 32 32 24.822 32 16S24.826 0 16.004 0zm9.318 22.594c-.39 1.096-1.932 2.006-3.158 2.27-.838.18-1.934.322-5.61-1.206-4.706-1.952-7.732-6.73-7.964-7.044-.224-.314-1.876-2.498-1.876-4.764 0-2.266 1.19-3.378 1.612-3.84.39-.428.924-.558 1.23-.558.298 0 .584.002.84.016.27.012.63-.102.984.754.39.952 1.332 3.236 1.446 3.466.114.23.19.5.038.796-.152.308-.286.498-.528.768-.242.27-.468.478-.71.726-.22.224-.47.462-.198.866.266.396 1.184 1.952 2.54 3.162 1.744 1.558 3.168 2.042 3.676 2.27.396.178.822.1 1.078-.214.266-.324.59-.862.924-1.386.236-.372.534-.42.894-.284.364.13 2.306 1.084 2.7 1.28.396.196.66.294.756.458.096.164.096.95-.294 1.87z"/></svg></div>
        <div class="wa-chatbox-info"><h4>myTask Support</h4><span>En ligne</span></div>
      </div>
      <div class="wa-chatbox-body"><div class="wa-chatbox-bubble">Bonjour ! Comment puis-je vous aider ?</div></div>
      <div class="wa-chatbox-footer">
        <input type="text" class="wa-chatbox-input" id="waInput" placeholder="Tapez votre message..." maxlength="500">
        <button class="wa-chatbox-send" id="waSend" aria-label="Envoyer"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
      </div>
    </div>
    <button class="wa-widget-btn" id="waBtn" aria-label="Ouvrir le chat WhatsApp"><svg viewBox="0 0 32 32"><path d="M16.004 0h-.008C7.174 0 0 7.176 0 16c0 3.5 1.132 6.744 3.058 9.374L1.054 30.69l5.532-1.742A15.9 15.9 0 0 0 16.004 32C24.826 32 32 24.822 32 16S24.826 0 16.004 0zm9.318 22.594c-.39 1.096-1.932 2.006-3.158 2.27-.838.18-1.934.322-5.61-1.206-4.706-1.952-7.732-6.73-7.964-7.044-.224-.314-1.876-2.498-1.876-4.764 0-2.266 1.19-3.378 1.612-3.84.39-.428.924-.558 1.23-.558.298 0 .584.002.84.016.27.012.63-.102.984.754.39.952 1.332 3.236 1.446 3.466.114.23.19.5.038.796-.152.308-.286.498-.528.768-.242.27-.468.478-.71.726-.22.224-.47.462-.198.866.266.396 1.184 1.952 2.54 3.162 1.744 1.558 3.168 2.042 3.676 2.27.396.178.822.1 1.078-.214.266-.324.59-.862.924-1.386.236-.372.534-.42.894-.284.364.13 2.306 1.084 2.7 1.28.396.196.66.294.756.458.096.164.096.95-.294 1.87z"/></svg></button>
  </div>
  <script>
  (function(){
    var btn=document.getElementById('waBtn'),box=document.getElementById('waChatbox'),
        input=document.getElementById('waInput'),send=document.getElementById('waSend');
    var isOpen=false;
    btn.addEventListener('click',function(){
      isOpen=!isOpen;box.classList.toggle('open',isOpen);btn.classList.toggle('active',isOpen);
      if(isOpen) input.focus();
    });
    function sendMsg(){
      var text=input.value.trim();if(!text)return;input.value='';
      isOpen=false;box.classList.remove('open');btn.classList.remove('active');
      window.open('https://wa.me/25776871111?text='+encodeURIComponent(text),'_blank');
    }
    send.addEventListener('click',sendMsg);
    input.addEventListener('keydown',function(e){if(e.key==='Enter')sendMsg();});
  })();
  </script>
</body>
</html>
